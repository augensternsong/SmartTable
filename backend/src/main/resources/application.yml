server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: form-system
  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  # Servlet 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_UUID # String 主键走自定义 NanoIdGenerator.nextUUID() 生成 8 位 NanoId
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 业务配置
form:
  # JWT
  jwt:
    secret: Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXJhbmRvbS1zZWNyZXQta2V5LWZvci1mb3JtLXN5c3RlbS0yMDI2
    # access token 有效期(秒) 默认 2小时
    access-token-ttl: 7200
    # refresh token 有效期(秒) 默认 7天
    refresh-token-ttl: 604800
    # token 在 header 中的名字
    header: Authorization
    # token 前缀
    prefix: "Bearer "
  # 默认管理员初始账号
  init:
    admin-username: admin
    admin-password: admin123
    admin-nickname: 超级管理员

logging:
  level:
    root: INFO
    com.example.form: DEBUG
